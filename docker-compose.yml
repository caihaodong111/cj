services:
  backend:
    image: backend:0.1
    container_name: mediacrawler-backend
    env_file:
      - ./.env
    environment:
      DJANGO_DEBUG: "False"
      RUN_DB_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
      MEDIACRAWLER_QR_MODE: "web"
      ENABLE_REMOTE_DESKTOP: "1"
      XVFB_DISPLAY: ":99"
      XVFB_SCREEN: "1600x900x24"
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"
    init: true
    ipc: host
    shm_size: "1gb"
    restart: unless-stopped
    ports:
      - "6080:6080"
    expose:
      - "8000"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
      - backend_data:/app/data
      - backend_browser_data:/app/crawler/browser_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mediacrawler-network

  frontend:
    image: frontend:0.1
    container_name: mediacrawler-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - backend_static:/var/www/backend/static:ro
      - backend_media:/var/www/backend/media:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - mediacrawler-network

networks:
  mediacrawler-network:
    driver: bridge

volumes:
  backend_static:
  backend_media:
  backend_logs:
  backend_data:
  backend_browser_data:
